  for(let x=0;x<W;x++) if(!inPit(x)) for(let y=top;y<H;y++) tl[y][x]='#';
  for(const [a,b,r] of L.plats) for(let x=a;x<=b;x++) if(tl[r][x]===' ') tl[r][x]='=';
  if(L.stones) for(const [px] of L.pits) tl[7][px+1]='=';
  const gates=L.gates.map((tx,n)=>({tx,n,open:false,star:false}));
  for(const gt of gates) for(let y=0;y<top;y++){ tl[y][gt.tx]='G'; tl[y][gt.tx+1]='G'; }
  const bs=[], nearGate=x=>L.gates.some(gx=>x>=gx-3&&x<=gx+4);

  for(const [a,b,r] of L.plats) for(let x=a;x<=b;x++) if(!nearGate(x)) addB(x*T+4,(r-1)*T+4);
  for(const [px,pw] of L.pits){ addB(px*T+4,5*T+4); addB((px+pw/2)*T-4,4*T+8); addB((px+pw-1)*T+4,5*T+4); }
  for(let x=6;x<W-7;x+=7) if(!nearGate(x)&&!inPit(x)&&!inPit(x+2)) for(let k=0;k<3;k++) addB((x+k)*T+4,(top-1)*T+4);
  LV={W,H,top,t:tl,gates,berries:bs,stars:0,got:0,exitX:(W-4)*T+8,

  e.x+=dx; const x0=Math.floor(e.x/T), x1=Math.floor((e.x+e.w-0.01)/T), y0=Math.floor(e.y/T), y1=Math.floor((e.y+e.h-0.01)/T);
  for(let ty=y0;ty<=y1;ty++) for(let tx=x0;tx<=x1;tx++) if(solid(tileAt(tx,ty))){ if(dx>0) e.x=tx*T-e.w; else if(dx<0) e.x=(tx+1)*T; e.vx=0; return true; }
  return false;
}
function moveY(e,dy){
  const prevBottom=e.y+e.h; e.y+=dy; e.ground=false;
  const x0=Math.floor(e.x/T), x1=Math.floor((e.x+e.w-0.01)/T), y0=Math.floor(e.y/T), y1=Math.floor((e.y+e.h-0.01)/T);
  for(let ty=y0;ty<=y1;ty++) for(let tx=x0;tx<=x1;tx++){
    const c=tileAt(tx,ty);
    if(solid(c)){ if(dy>0){ e.y=ty*T-e.h; e.ground=true; } else if(dy<0){ e.y=(ty+1)*T; } e.vy=0; }
    else if(c==='='&&dy>0&&prevBottom<=ty*T+0.01){ e.y=ty*T-e.h; e.vy=0; e.ground=true; }
  }
}
function burst(x,y,n,colors,spd=2,life=36){ for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, s=Math.random()*spd; parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:life*(0.6+Math.random()*0.6),c:pick(colors),g:0.08}); } }
function float(x,y,s,c='#FFE14D'){ texts.push({x,y,s,life:55,c}); }
const CONFETTI=['#E53935','#1E88E5','#FDD835','#43A047','#FB8C00','#8E24AA','#fff'];

function respawn(){
  P.x=P.spawnX; P.y=P.spawnY; P.vx=P.vy=0; P.inv=90; P.ground=true;
  camX=clamp(P.x-VW/2,0,Math.max(0,LV.W*T-VW));
  burst(P.x+5,P.y+11,18,['#BFF6FF','#FFFFFF','#7EC8FF'],1.6,40); sfx('bubble');
  toast={msg:"WHOOPS! BERNIE'S BUBBLE!",until:t+110};
}
function updPlayer(){
  const ax=(down.right?1:0)-(down.left?1:0);
  if(ax){ P.vx+=ax*(P.ground?ACC:ACC*0.85); P.face=ax; } else P.vx*=P.ground?0.78:0.96;
  P.vx=clamp(P.vx,-MAXRUN,MAXRUN); if(!ax&&Math.abs(P.vx)<0.05) P.vx=0;
  if(P.ground) P.coyote=7; else if(P.coyote>0) P.coyote--;
  if(jumpHit()) P.jbuf=8; else if(P.jbuf>0) P.jbuf--;
  if(P.jbuf>0&&P.coyote>0){ P.vy=JUMPV; P.ground=false; P.coyote=0; P.jbuf=0; sfx('jump'); }
  P.vy=Math.min(MAXFALL,P.vy+GRAV);
  moveX(P,P.vx); moveY(P,P.vy);
  if(P.inv>0) P.inv--;
  P.anim+=Math.abs(P.vx)*0.12;
  if(P.y>LV.H*T+10){ respawn(); return; }
  // springs
  for(const s of LV.springs){ if(s.squash>0) s.squash--; if(P.vy>=0&&P.x+P.w>s.x+2&&P.x<s.x+s.w-2&&P.y+P.h>=s.y&&P.y+P.h<=s.y+s.h+8){ P.vy=-7.8; P.ground=false; s.squash=10; sfx('spring'); } }
  // checkpoint flags
  for(const f of LV.flags) if(!f.on&&P.x+P.w>f.x&&P.x<f.x+14){ f.on=true; P.spawnX=f.x; burst(f.x+8,LV.top*T-24,10,CONFETTI,1.5); sfx('flag'); toast={msg:'CHECKPOINT!',until:t+60}; for(const o of LV.flags) if(o!==f&&o.x<f.x) o.on=true; }
  // berries
  for(const b of LV.berries) if(!b.got&&P.x+P.w>b.x&&P.x<b.x+8&&P.y+P.h>b.y&&P.y<b.y+8){ b.got=true; LV.got++; berries++; sfx('berry'); burst(b.x+4,b.y+4,4,['#2F6BFF','#fff'],1,18); }
  // critters: bop from above, gentle bump from the side (no damage)
  for(const c of LV.crits){
    if(!c.alive) continue;
    c.x+=c.vx; const fx=c.vx>0?c.x+c.w+1:c.x-1, tx=Math.floor(fx/T);
    const wall=solid(tileAt(tx,Math.floor((c.y+c.h-2)/T))), below=tileAt(tx,Math.floor((c.y+c.h+2)/T)), edge=!(solid(below)||below==='=');
    if(wall||edge||Math.abs(c.x-c.ox)>5*T) c.vx=-c.vx;
    if(overlap(P,c)){
      if(P.vy>0.5&&P.y+P.h-c.y<13){ c.alive=false; P.vy=-5; P.ground=false; sfx('bop'); burst(c.x+6,c.y+5,12,['#55FF55','#fff','#FFE14D'],2); float(c.x,c.y-6,'BOP!'); }
      else if(P.inv<=0){ P.vx=(P.x+P.w/2<c.x+c.w/2)?-2.6:2.6; P.vy=-3; P.inv=70; sfx('bump'); float(P.x,P.y-6,'OOPS!','#fff'); }
    }
  }
  // Professor Pebbles' gates
  if(gateCD>0) gateCD--;
  for(const gt of LV.gates) if(!gt.open&&gateCD<=0&&P.x+P.w>=gt.tx*T-3&&P.x<gt.tx*T&&P.y+P.h>LV.top*T-50) startQuiz(gt);
  if(P.x>LV.exitX) finishLevel();
  hist.push({x:P.x,y:P.y,face:P.face}); if(hist.length>40) hist.shift();
}
function updCam(){
  const target=clamp(P.x+P.w/2-VW/2+P.face*22,0,Math.max(0,LV.W*T-VW));
  camX+=(target-camX)*0.12; camX=clamp(camX,0,Math.max(0,LV.W*T-VW));
}
function updFx(){
  for(const p of parts){ p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.life--; } parts=parts.filter(p=>p.life>0);
  for(const x of texts){ x.y-=0.4; x.life--; } texts=texts.filter(x=>x.life>0);
}

/* ---------------- quiz ---------------- */
function startQuiz(gt){
  const L=LEVELS[lvl], gname=L.gens[gt.n], name=Array.isArray(gname)?gname[diff]:gname;
  const q=GEN[name]();
  quiz={gate:gt,q,sel:0,wrong:[],done:false,t:0,msg:'',msgUntil:0};
  state='quiz'; say(q.say); sfx('menu');
}
function nextSel(dir){
  if(!quiz) return; const n=quiz.q.choices.length;
  for(let k=1;k<=n;k++){ const i=(quiz.sel+dir*k+n*3)%n; if(!quiz.wrong.includes(i)){ quiz.sel=i; sfx('menu'); return; } }
}
function answer(i){
  if(!quiz||quiz.done||quiz.wrong.includes(i)) return;
  quiz.sel=i;
  if(i===quiz.q.ans){
    quiz.done=true; quiz.t=0; if(quiz.wrong.length===0){ quiz.gate.star=true; LV.stars++; }
    quiz.msg=pick(['GREAT JOB!','YOU GOT IT!','AWESOME!','SUPER SMART!']); quiz.msgUntil=1e9;
    sfx('cheer'); say(pick(['Great job!','You got it!','Awesome!','Super smart!'])); burst(VW/2,60,40,CONFETTI,3,60);
  } else {
    quiz.wrong.push(i); quiz.msg='TRY AGAIN!'; quiz.msgUntil=quiz.t+90; sfx('wrong'); say('Try again!');
    const left=quiz.q.choices.map((_,k)=>k).filter(k=>!quiz.wrong.includes(k)); quiz.sel=left[0];
  }
}
function leaveQuiz(){ state='play'; P.x=Math.max(0,quiz.gate.tx*T-34); P.vx=0; gateCD=60; quiz=null; try{ speechSynthesis.cancel(); }catch(e){} }
function openGate(gt){
  gt.open=true; for(let y=0;y<LV.top;y++){ LV.t[y][gt.tx]=' '; LV.t[y][gt.tx+1]=' '; }
  burst(gt.tx*T+16,70,50,['#8A8A9A','#C8C8D8','#FFE14D','#fff'],3,50); sfx('gate');
}
function updQuiz(){
  quiz.t++;
  if(!quiz.done){
    if(hit.has('left')) nextSel(-1); if(hit.has('right')) nextSel(1);
    if(confirmHit()) answer(quiz.sel);
    if(hit.has('pause')) leaveQuiz();
  } else if((quiz.t>40&&(confirmHit()||(hit.has('tap')&&!tapUsed)))||quiz.t>150){
    openGate(quiz.gate); state='play'; quiz=null; gateCD=30;
  }
  updFx();
}

/* ---------------- level flow ---------------- */
function finishLevel(){
  state='levelEnd'; endT=0;
  saveData.stars[lvl]=Math.max(saveData.stars[lvl]||0,LV.stars); persist();
  sfx('win'); const m=MEMBER[LEVELS[lvl].member];
  say(lvl===4?'The whole family is together! Dinner time!':`You found ${lc(m)}! Great learning!`); burst(P.x+5,P.y,50,CONFETTI,3,70);
}
const totalStars=()=>Object.values(saveData.stars).reduce((a,b)=>a+b,0);

/* ---------------- screens ---------------- */
function toSelect(i){ selIdx=clamp(i,0,LEVELS.length-1); state='select'; }
function setHero(k){ heroKey=k; K=HEROES[k].frames; saveData.hero=k; persist(); sfx('menu'); }
function setDiff(d){ diff=d; saveData.diff=d; persist(); sfx('menu'); }
function updTitle(){
  if(hit.has('left')) setHero('kellan'); if(hit.has('right')) setHero('diana');
  if(hit.has('up')) setDiff(0); if(hit.has('down')) setDiff(1);
  if(confirmHit()&&!hit.has('tap')) { toSelect(firstOpen()); sfx('menu'); }
}
const firstOpen=()=>{ for(let i=0;i<LEVELS.length;i++) if((saveData.stars[i]===undefined)) return i; return 0; };
function updSelect(){
  if(hit.has('left')) { selIdx=(selIdx+LEVELS.length-1)%LEVELS.length; sfx('menu'); }
  if(hit.has('right')) { selIdx=(selIdx+1)%LEVELS.length; sfx('menu'); }
  if(confirmHit()) startLevel(selIdx);
  if(hit.has('pause')) state='title';
}
function updPause(){
  if(confirmHit()||hit.has('pause')) state=pausedFrom;
}
function updEnd(){
  endT++; updFx(); if(endT%12===0&&endT<200) burst(rnd(40,VW-40),rnd(20,60),10,CONFETTI,2.5,50);
  if(endT>50&&(confirmHit()||(hit.has('tap')&&!tapUsed))){ if(lvl===LEVELS.length-1){ state='ending'; endT=0; say('Hooray! You helped the whole dino family!'); } else toSelect(lvl+1); }
}
function updEnding(){
  endT++; updFx(); if(endT%10===0) burst(rnd(20,VW-20),rnd(10,60),8,CONFETTI,2.5,60);
  if(endT>120&&(confirmHit()||(hit.has('tap')&&!tapUsed))) state='title';
}
function step(){
  t++;
  const mode=state==='play'?'play':state==='quiz'?'quiz':'menu'; if(document.body.dataset.mode!==mode) document.body.dataset.mode=mode;
  tapUsed=false;
  if(hit.has('mute')) cycleSound();
  if(hit.has('voice')) toggleVoice();
  if(hit.has('tap')){ for(let i=hot.length-1;i>=0;i--){ const h=hot[i]; if(tapX>=h.x&&tapX<=h.x+h.w&&tapY>=h.y&&tapY<=h.y+h.h){ tapUsed=true; h.fn(); break; } } }
  switch(state){
    case 'title': updTitle(); break;
    case 'select': updSelect(); break;
    case 'play':
      updPlayer(); if(state==='play'){ updCam(); updFx(); if(banner&&t>banner.until) banner=null; if(hit.has('pause')){ pausedFrom='play'; state='pause'; } }
      break;
    case 'quiz': updQuiz(); break;
    case 'pause': updPause(); break;
    case 'levelEnd': updEnd(); break;
    case 'ending': updEnding(); break;
  }
  setMusic(wantedTune());
  hit.clear();
}

/* ---------------- drawing ---------------- */
const HILL1=Array.from({length:1024},(_,i)=>34+Math.sin(i/37)*14+Math.sin(i/13)*5+Math.sin(i/97)*10);
const HILL2=Array.from({length:1024},(_,i)=>16+Math.sin(i/23+1)*7+Math.sin(i/7)*2+Math.sin(i/61)*6);
function circle(x,y,r){ g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill(); }
function rect(c,x,y,w,h){ g.fillStyle=c; g.fillRect(x|0,y|0,w,h); }
function lerpCol(a,b,f){ const pa=parseInt(a.slice(1),16), pb=parseInt(b.slice(1),16); const m=(s)=>Math.round(((pa>>s)&255)*(1-f)+((pb>>s)&255)*f); return `rgb(${m(16)},${m(8)},${m(0)})`; }
function drawBG(th,ox){
  for(let i=0;i<8;i++){ rect(lerpCol(th.sky[0],th.sky[1],i/7),0,i*(PH/8),VW,PH/8+1); }
  const dec=th.deco;
  if(dec==='clouds'||dec==='volcano'||dec==='mesas'||dec==='reeds'){
    g.fillStyle=dec==='volcano'?'#FFD0E0':'#ffffff'; for(let i=0;i<4;i++){ const x=((i*190-ox*0.2)%760+760)%760-60, y=18+((i*37)%30); circle(x,y,9); circle(x+10,y+2,7); circle(x-9,y+3,6); }
    if(dec!=='volcano'){ g.fillStyle='#FFF3A0'; circle(VW-40,26,12); }
  }
  if(dec==='cave'){ g.fillStyle='#fff'; for(let i=0;i<30;i++){ const x=((i*97-ox*0.1)%VW+VW)%VW, y=(i*53)%100; g.fillRect(x|0,y,1,1); } g.fillStyle='#241a50'; for(let i=0;i<10;i++){ const x=((i*80-ox*0.5)%(VW+80)+VW+80)%(VW+80)-40; g.beginPath(); g.moveTo(x-10,0); g.lineTo(x+10,0); g.lineTo(x,22+(i*7)%16); g.fill(); } }
  if(dec==='mesas'){ g.fillStyle=th.far; for(let i=0;i<4;i++){ const x=((i*170-ox*0.25)%680+680)%680-60; g.fillRect(x,PH-90,46,90); g.fillRect(x+8,PH-100,30,10); } }
  if(dec==='volcano'){ g.fillStyle='#6A3A5A'; const vx=((260-ox*0.2)%700+700)%700-60; g.beginPath(); g.moveTo(vx-60,PH); g.lineTo(vx-14,PH-80); g.lineTo(vx+14,PH-80); g.lineTo(vx+60,PH); g.fill(); g.fillStyle='#FF7A30'; g.fillRect(vx-12,PH-84,24,5); }
  g.fillStyle=th.far; for(let x=0;x<VW;x+=2){ const h=HILL1[(Math.floor(ox*0.3)+x)&1023]; g.fillRect(x,PH-h-30,2,h+30); }
  g.fillStyle=th.near; for(let x=0;x<VW;x+=2){ const h=HILL2[(Math.floor(ox*0.55)+x)&1023]; g.fillRect(x,PH-h-14,2,h+14); }
  if(dec==='reeds'){ g.fillStyle='#3E7F52'; for(let i=0;i<14;i++){ const x=((i*53-ox*0.6)%(VW+60)+VW+60)%(VW+60)-30; g.fillRect(x,PH-70,2,40); g.fillRect(x-1,PH-74,4,8); } }
}
function drawTiles(th,ox){
  const x0=Math.floor(ox/T), x1=Math.ceil((ox+VW)/T);
  for(let ty=0;ty<LV.H;ty++) for(let tx=x0;tx<=x1;tx++){
    const c=tileAt(tx,ty); if(c===' ') continue; const px=tx*T-ox, py=ty*T;
    if(c==='#'){
      rect(th.ground,px,py,T,T);
      if(!solid(tileAt(tx,ty-1))){ rect(th.grass,px,py,T,4); rect('#00000033',px,py+4,T,1); for(let k=0;k<4;k++) rect(th.grass,px+k*4+1,py+4,2,2); }
      else { rect(th.groundD,px+3,py+4,2,2); rect(th.groundD,px+10,py+9,3,2); rect(th.groundD,px+6,py+13,2,2); }
      if(!solid(tileAt(tx,ty+1))&&ty<LV.H-1) rect(th.groundD,px,py+T-2,T,2);
    } else if(c==='='){
      rect('#00000055',px,py+4,T,5); rect(th.grass,px,py,T,4); rect(th.groundD,px,py+4,T,4); rect(th.ground,px+1,py+4,T-2,3);
    } else if(c==='G'){
      rect('#8A8A9A',px,py,T,T); rect('#5A5A6A',px,py+7,T,2); rect('#5A5A6A',px+((ty&1)?4:11),py,2,8); rect('#5A5A6A',px+((ty&1)?11:4),py+9,2,7); rect('#B8B8C8',px,py,T,1);
    }
  }
}
function starPoly(x,y,r,col){ g.fillStyle=col; g.beginPath(); for(let i=0;i<10;i++){ const rr=i%2?r*0.45:r, a=-Math.PI/2+i*Math.PI/5; i?g.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr):g.moveTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr); } g.closePath(); g.fill(); }
function drawHero(x,y,face,moving,air){
  const fr=HEROES[heroKey].frames, f=air?fr.jump:(moving?(((t>>3)&1)?fr.walk:fr.idle):fr.idle);
  g.drawImage(face>0?f.r:f.l,Math.round(x)-3,Math.round(y)-2);
}
function drawEnts(ox){
  const L=LEVELS[lvl], top=LV.top*T;
  for(const f of LV.flags){ const x=f.x-ox; if(x<-20||x>VW+20) continue; rect('#6B3F1C',x+7,top-28,2,28); rect(f.on?'#43A047':'#999',x+9,top-28,10,8); rect(f.on?'#fff':'#bbb',x+10,top-27,3,2); }
  for(const s of LV.springs){ const x=s.x-ox, sq=s.squash>0?3:0; rect('#F5E6C8',x+6,s.y+3+sq,4,5-sq); rect('#E53935',x+1,s.y+sq,14,5); rect('#fff',x+4,s.y+1+sq,2,2); rect('#fff',x+10,s.y+2+sq,2,2); }
  // the family member waits in a nest past the last gate
  { const x=(LV.W-3)*T-ox; if(x>-40&&x<VW+40){ g.drawImage(DINO[L.member].l,Math.round(x)-6,top-26+((t>>4)&1)); rect('#8B5A2B',x-4,top-2,32,5); rect('#6B3F1C',x-2,top+1,28,2); g.drawImage(EGG,x+22,top-12); } }
  for(const gt of LV.gates){
    const px=(gt.tx-3)*T-ox+2; if(px>-40&&px<VW+40) g.drawImage(DINO.prof.l,Math.round(px)-6,top-25+((t>>4)&1)*(gt.open?1:0));
    if(!gt.open&&gt.tx*T-ox>-40&&gt.tx*T-ox<VW){ const qx=gt.tx*T-ox+16; post.push(()=>txt('?',qx,64,16,'#FFE14D','center')); }
  }
  for(const b of LV.berries) if(!b.got){ const x=b.x-ox; if(x<-10||x>VW+10) continue; g.drawImage(BERRY,Math.round(x),Math.round(b.y+Math.sin(t*0.08+b.ph)*1.5)); }
  for(const c of LV.crits) if(c.alive){ const x=c.x-ox; if(x<-20||x>VW+20) continue; g.drawImage((c.vx>0?SL.blob.r:SL.blob.l),Math.round(x)-2,Math.round(c.y+c.h-15)); }
  // Bernie trails behind
  if(hist.length>14){ const h=hist[hist.length-14], sp=(Math.abs(P.vx)>0.3)&&((t>>3)&1)?1:0; g.drawImage((P.x>h.x+2||(P.x>=h.x-2&&P.face>0))?SL.pup.r:SL.pup.l,Math.round(h.x-ox)-3,Math.round(h.y+P.h-15-sp)); }
  if(!(P.inv>0&&((t>>2)&1))) drawHero(P.x-ox,P.y,P.face,Math.abs(P.vx)>0.3,!P.ground);
  for(const p of parts){ g.fillStyle=p.c; const s=p.life>14?2:1; g.fillRect(((p.x-ox)|0),(p.y|0),s,s); }
  for(const x of texts){ const tx=x.x-ox, ty=x.y, c=x.c, s=x.s; post.push(()=>txt(s,tx,ty,6,c,'left')); }
}
function drawHUD(){
  rect('#2B1B4E',0,PH,VW,VH-PH); rect('#5B3FA0',0,PH,VW,1);
  g.drawImage(K.idle.r,0,0,16,12,4,PH+6,16,12);
  g.drawImage(BERRY,28,PH+8); post.push(()=>txt('x'+berries,40,PH+9,8,'#fff'));
  const L=LEVELS[lvl]; post.push(()=>txt(L.name,VW/2,PH+9,7,'#FFE14D','center'));
  const n=LV.gates.length; for(let i=0;i<n;i++){ starPoly(VW-10-(n-1-i)*13,PH+12,6,i<LV.stars?'#FFE14D':'#5B3FA0'); }
}
function drawPlay(){
  const L=LEVELS[lvl], th=THEMES[L.theme], ox=Math.round(camX);
  drawBG(th,ox); drawTiles(th,ox); drawEnts(ox); drawHUD();
}
function txt(s,x,y,size=8,color='#FFFFFF',align='left',shadow=true){
  cx.font=`${Math.round(size*SC)}px "Press Start 2P", "Courier New", monospace`; cx.textAlign=align; cx.textBaseline='top';
  if(shadow){ cx.fillStyle='#000'; cx.fillText(s,Math.round((x+1)*SC),Math.round((y+1)*SC)); }
  cx.fillStyle=color; cx.fillText(s,Math.round(x*SC),Math.round(y*SC));
}
function wrap(s,maxChars){ const out=[]; let line=''; for(const w of s.split(' ')){ if((line+' '+w).trim().length>maxChars){ out.push(line); line=w; } else line=(line+' '+w).trim(); } if(line) out.push(line); return out; }
function blitFlush(){ cx.imageSmoothingEnabled=false; cx.drawImage(lo,0,0,cv.width,cv.height); for(const f of post) f(); post.length=0; }
function bubble(msg,y=6){
  const lines=wrap(msg,Math.floor((VW-60)/7)), h=12+lines.length*10, w=VW-24;
  rect('#000',10,y,w+4,h+4); rect('#FFF6DC',12,y+2,w,h); g.drawImage(SL.pupOpen.r,14,y+2);
  lines.forEach((l,i)=>{ post.push(()=>txt(l,36,y+7+i*10,7,'#3A2A5A','left',false)); });
}
function overlayMsgs(){
  if(banner) bubble(banner.txt);

function itemImg(what){ return what==='berry'?[BERRY,16,16]:what==='egg'?[EGG,14,17]:[STAR,22,17]; }

function drawShape(s,x,y,sz,col){
  const r=sz/2; g.fillStyle=col; g.strokeStyle='#222'; g.lineWidth=1.5; g.beginPath();
  const poly=pts=>pts.forEach(([px,py],i)=>i?g.lineTo(px,py):g.moveTo(px,py));
  const reg=(n,rot)=>{ const a=[]; for(let i=0;i<n;i++){ const an=rot+i*2*Math.PI/n; a.push([x+Math.cos(an)*r,y+Math.sin(an)*r]); } return a; };
  switch(s){
    case 'circle': g.arc(x,y,r,0,Math.PI*2); break;
    case 'square': g.rect(x-r*0.85,y-r*0.85,r*1.7,r*1.7); break;
    case 'rectangle': g.rect(x-r*1.1,y-r*0.6,r*2.2,r*1.2); break;
    case 'oval': g.ellipse(x,y,r*1.15,r*0.7,0,0,Math.PI*2); break;
    case 'triangle': poly([[x,y-r],[x+r*1.05,y+r*0.8],[x-r*1.05,y+r*0.8]]); g.closePath(); break;
    case 'diamond': poly([[x,y-r*1.05],[x+r*0.8,y],[x,y+r*1.05],[x-r*0.8,y]]); g.closePath(); break;
    case 'hexagon': poly(reg(6,0)); g.closePath(); break;
    case 'pentagon': poly(reg(5,-Math.PI/2)); g.closePath(); break;
    case 'star': { const a=[]; for(let i=0;i<10;i++){ const rr=i%2?r*0.45:r*1.05, an=-Math.PI/2+i*Math.PI/5; a.push([x+Math.cos(an)*rr,y+Math.sin(an)*rr]); } poly(a); g.closePath(); break; }
    case 'heart': g.moveTo(x,y+r*0.9); g.bezierCurveTo(x-r*1.5,y-r*0.1,x-r*0.7,y-r*1.1,x,y-r*0.35); g.bezierCurveTo(x+r*0.7,y-r*1.1,x+r*1.5,y-r*0.1,x,y+r*0.9); g.closePath(); break;
  }
  g.fill(); g.stroke();
}

function frame(now){

}
